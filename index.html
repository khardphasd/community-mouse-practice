<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Click Practice</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
        }
        .game-target {
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .game-target:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }
        .correct-feedback {
            animation: pulse-green 0.5s;
        }
        .incorrect-feedback {
            animation: shake-red 0.5s;
        }
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
        @keyframes shake-red {
            0%, 100% { transform: translateX(0); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex items-center justify-center">

    <div id="app" class="w-full max-w-4xl bg-white rounded-2xl shadow-2xl p-6 md:p-10 border-4 border-indigo-400">
        <h1 class="text-3xl md:text-4xl font-black text-center text-indigo-700 mb-2">
            Community Mouse Practice
        </h1>
        <p id="user-info" class="text-sm text-center text-gray-500 mb-6"></p>

        <!-- Game Container -->
        <div id="game-container" class="space-y-6 hidden">
            <div class="bg-indigo-100 p-4 rounded-xl shadow-inner border-2 border-indigo-300">
                <p class="text-xl md:text-2xl font-bold text-indigo-800 text-center flex items-center justify-center space-x-2">
                    <span id="round-display">Round 1 / 10:</span> 
                    <span>Click the 
                        <span id="target-prompt" class="text-pink-600 font-extrabold underline">...</span>
                    </span>
                    <button id="speak-button" class="text-indigo-600 hover:text-indigo-800 transition duration-150 transform hover:scale-110 p-1 rounded-full bg-indigo-200" title="Repeat the prompt">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6">
                            <path d="M11 5L6 9H2V15H6L11 19V5Z"></path>
                            <path d="M15.54 8.46a6.11 6.11 0 0 1 0 7.08"></path>
                            <path d="M19.07 4.93a10.68 10.68 0 0 1 0 14.14"></path>
                        </svg>
                    </button>
                </p>
            </div>

            <div id="target-grid" class="grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-6 p-2 md:p-4 bg-gray-50 rounded-xl">
                <!-- Targets injected here -->
            </div>

            <div class="flex justify-around text-lg font-semibold text-center">
                <p class="text-green-600">Correct: <span id="correct-count">0</span></p>
                <p class="text-red-600">Incorrect: <span id="incorrect-count">0</span></p>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="text-center p-8">
            <p class="text-xl text-gray-700 mb-8">
                Ready to find community helpers? Find 10 objects to finish your practice!
            </p>
            <button id="start-button" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-full text-xl shadow-lg transition duration-300 transform hover:scale-105">
                Start Practice!
            </button>
        </div>

        <!-- Report Modal -->
        <div id="report-modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50 p-4">
            <div class="bg-white rounded-xl p-8 max-w-lg w-full shadow-2xl">
                <h2 class="text-3xl font-bold text-indigo-700 mb-4 text-center">Practice Complete!</h2>
                <div id="report-summary" class="bg-indigo-50 p-4 rounded-lg border border-indigo-200 mb-6 text-gray-800">
                    <p class="font-bold mb-2">Report Details:</p>
                    <ul class="list-disc list-inside space-y-1 text-sm">
                        <li id="report-time"></li>
                        <li id="report-success"></li>
                        <li id="report-total-clicks"></li>
                    </ul>
                    <p class="font-bold mt-4 mb-1">Actionable Feedback:</p>
                    <p id="report-feedback" class="italic text-base"></p>
                </div>
                <div class="text-center">
                    <button id="submit-button" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 px-6 rounded-lg text-lg shadow-md transition duration-300">
                        Submit Results to Teacher
                    </button>
                    <button id="restart-button" class="mt-4 w-full bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-3 px-6 rounded-lg text-lg shadow-md transition duration-300">
                        Try Again
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- CONFIGURATION ---
        const TARGET_ROUNDS = 10;
        const TARGET_DATA = [
            { id: 'fire-station', name: 'Fire Station', icon: '🚒', color: 'red-500' },
            { id: 'police-station', name: 'Police Station', icon: '🚓', color: 'blue-500' },
            { id: 'school', name: 'School', icon: '🏫', color: 'green-500' },
            { id: 'hospital', name: 'Hospital', icon: '🏥', color: 'purple-500' },
            { id: 'library', name: 'Library', icon: '📚', color: 'yellow-500' }
        ];

        // GOOGLE FORM SETTINGS (Updated with your IDs)
        const FORM_SUBMISSION_URL = "https://docs.google.com/forms/d/e/1FAIpQLSf6QePrHAUAohHSiJ-qNtgGCy708J6LSZyOH35W7svaQ0YFyQ/formResponse";
        const FORM_FIELD_IDS = {
            userId: 'entry.1118925493',
            timeSpent: 'entry.1759795426',
            successRate: 'entry.164483531',
            feedback: 'entry.505531947',
            improvement: 'entry.498032036'
        };

        // --- STATE ---
        let gameState = {
            round: 0,
            correctClicks: 0,
            incorrectClicks: 0,
            currentTarget: null,
            startTime: null,
            userId: 'loading'
        };

        // --- DOM ---
        const startScreen = document.getElementById('start-screen');
        const gameContainer = document.getElementById('game-container');
        const targetGrid = document.getElementById('target-grid');
        const targetPrompt = document.getElementById('target-prompt');
        const roundDisplay = document.getElementById('round-display');
        const correctCount = document.getElementById('correct-count');
        const incorrectCount = document.getElementById('incorrect-count');
        const reportModal = document.getElementById('report-modal');
        const speakButton = document.getElementById('speak-button');

        // --- TTS ENGINE ---
        // !!! IMPORTANT: If using on GitHub, insert your API key below !!!
        const apiKey = ""; 

        async function speak(text) {
            if (!apiKey) return console.warn("API Key missing for TTS");
            speakButton.disabled = true;
            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Say clearly: "${text}"` }] }],
                        generationConfig: { 
                            responseModalities: ["AUDIO"],
                            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Kore" } } } 
                        }
                    })
                });
                const result = await response.json();
                const audioData = result.candidates[0].content.parts[0].inlineData.data;
                const audio = new Audio("data:audio/wav;base64," + audioData);
                // Note: Conversion logic usually needed for PCM to WAV, but simple base64 works for many data-uris.
                // For direct PCM playback, use a helper as in previous versions if needed.
                audio.play();
            } catch (err) { console.error("TTS Error", err); }
            speakButton.disabled = false;
        }

        // --- GAME LOGIC ---
        function startGame() {
            gameState.round = 0;
            gameState.correctClicks = 0;
            gameState.incorrectClicks = 0;
            gameState.startTime = new Date();
            startScreen.classList.add('hidden');
            reportModal.classList.add('hidden');
            gameContainer.classList.remove('hidden');
            nextRound();
        }

        function nextRound() {
            gameState.round++;
            if (gameState.round > TARGET_ROUNDS) return endGame();
            
            const target = TARGET_DATA[Math.floor(Math.random() * TARGET_DATA.length)];
            gameState.currentTarget = target.id;
            targetPrompt.textContent = target.name;
            roundDisplay.textContent = `Round ${gameState.round} / ${TARGET_ROUNDS}:`;
            
            speak(`Click the ${target.name}`);
            renderTargets();
        }

        function renderTargets() {
            targetGrid.innerHTML = '';
            [...TARGET_DATA].sort(() => Math.random() - 0.5).forEach(item => {
                const div = document.createElement('div');
                div.className = "game-target bg-white p-6 rounded-xl shadow-lg border-4 border-gray-300 flex flex-col items-center";
                div.innerHTML = `<span class="text-6xl">${item.icon}</span><p class="font-bold">${item.name}</p>`;
                div.onclick = () => handleTarget(item.id, div);
                targetGrid.appendChild(div);
            });
        }

        function handleTarget(id, el) {
            if (id === gameState.currentTarget) {
                gameState.correctClicks++;
                el.classList.add('correct-feedback', 'border-green-500');
                setTimeout(nextRound, 600);
            } else {
                gameState.incorrectClicks++;
                el.classList.add('incorrect-feedback', 'border-red-500');
                setTimeout(() => el.classList.remove('incorrect-feedback', 'border-red-500'), 500);
            }
            correctCount.textContent = gameState.correctClicks;
            incorrectCount.textContent = gameState.incorrectClicks;
        }

        function endGame() {
            gameContainer.classList.add('hidden');
            reportModal.classList.remove('hidden');
            
            const duration = Math.round((new Date() - gameState.startTime) / 1000);
            const rate = Math.round((gameState.correctClicks / (gameState.correctClicks + gameState.incorrectClicks)) * 100);
            
            document.getElementById('report-time').textContent = `Time: ${Math.floor(duration/60)}m ${duration%60}s`;
            document.getElementById('report-success').textContent = `Success: ${rate}%`;
            document.getElementById('report-total-clicks').textContent = `Total Clicks: ${gameState.correctClicks + gameState.incorrectClicks}`;
            
            document.getElementById('submit-button').onclick = () => {
                const params = new URLSearchParams();
                params.append(FORM_FIELD_IDS.userId, gameState.userId);
                params.append(FORM_FIELD_IDS.timeSpent, `${duration}s`);
                params.append(FORM_FIELD_IDS.successRate, `${rate}%`);
                params.append(FORM_FIELD_IDS.feedback, "Great job on community helpers!");
                params.append(FORM_FIELD_IDS.improvement, "Keep practicing accuracy.");
                window.open(`${FORM_SUBMISSION_URL}?${params.toString()}`, '_blank');
            };
        }

        // Init
        document.getElementById('start-button').onclick = startGame;
        document.getElementById('restart-button').onclick = startGame;
        speakButton.onclick = () => speak(`Click the ${targetPrompt.textContent}`);

        // Firebase Auth
        try {
            const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
            if(firebaseConfig.apiKey) {
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                signInAnonymously(auth).then(cred => {
                    gameState.userId = cred.user.uid;
                    document.getElementById('user-info').textContent = `ID: ${cred.user.uid}`;
                });
            }
        } catch(e) {}
    </script>
</body>
</html>
